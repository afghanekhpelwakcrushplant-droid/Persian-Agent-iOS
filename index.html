<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Persian Agent</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0;min-height:100vh}.app{max-width:760px;margin:auto;padding:18px}header{padding:22px 4px 14px}h1{margin:0 0 6px;font-size:28px}.sub{color:#6b7280}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0000000d}textarea{width:100%;min-height:110px;border:1px solid #d1d5db;border-radius:14px;padding:14px;font:inherit;resize:vertical}.row{display:flex;gap:10px;margin-top:12px}.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;cursor:pointer;background:#111827;color:#fff}.btn.secondary{background:#e5e7eb;color:#111827}.status{font-size:14px;color:#6b7280;margin-top:10px;min-height:20px}.result{white-space:pre-wrap;line-height:1.9}.pill{display:inline-block;background:#eef2ff;padding:5px 9px;border-radius:999px;font-size:12px}</style></head><body><main class="app"><header><h1>Persian Agent</h1><div class="sub">دستیار فارسی — نسخه پایه</div></header><section class="card"><span class="pill">Voice-first</span><textarea id="command" placeholder="دستور خود را بنویسید یا با صدا وارد کنید..."></textarea><div class="row"><button class="btn" id="run">اجرای دستور</button><button class="btn secondary" id="speak">خواندن پاسخ</button></div><div class="status" id="status"></div></section><section class="card"><div class="result" id="result">آماده دریافت دستور.</div></section></main><script src="app.js"></script></body></html>
