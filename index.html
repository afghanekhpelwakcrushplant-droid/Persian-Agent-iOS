<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Persian Agent</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;color:#111827;background:#f3f4f6}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:18px}header{padding:20px 4px 10px}h1{margin:0 0 6px}.sub{color:#6b7280}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0000000d}textarea,input{width:100%;border:1px solid #d1d5db;border-radius:14px;padding:13px;font:inherit}textarea{min-height:110px;resize:vertical}.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer;background:#111827;color:#fff}.btn.secondary{background:#e5e7eb;color:#111827}.status{font-size:14px;color:#6b7280;margin-top:10px;min-height:20px}.result{white-space:pre-wrap;line-height:1.9}.pill{display:inline-block;background:#eef2ff;padding:5px 9px;border-radius:999px;font-size:12px}.settings{display:none}.settings.open{display:block}.hint{font-size:13px;color:#6b7280;line-height:1.7}</style></head><body><main class="app"><header><h1>Persian Agent</h1><div class="sub">دستیار فارسی — موتور Agent اولیه</div></header><section class="card"><span class="pill">Voice-first</span><textarea id="command" placeholder="مثلاً: یک یادآوری برای فردا ساعت ۹ بساز..."></textarea><div class="row"><button class="btn" id="run">اجرای دستور</button><button class="btn secondary" id="speak">خواندن پاسخ</button><button class="btn secondary" id="settingsBtn">Settings</button></div><div class="status" id="status"></div></section><section class="card settings" id="settings"><h3>AI Settings</h3><label>OpenRouter API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="sk-or-v1-..."><div class="row"><button class="btn" id="saveKey">Save</button><button class="btn secondary" id="clearKey">Clear</button></div><p class="hint">کلید فقط در همین دستگاه و در localStorage ذخیره می‌شود و داخل GitHub قرار نمی‌گیرد.</p></section><section class="card"><div class="result" id="result">آماده دریافت دستور.</div></section></main><script src="app.js"></script></body></html>
