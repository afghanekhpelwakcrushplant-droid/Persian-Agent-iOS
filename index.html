<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00A898"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="دستیار فارسی"><link rel="manifest" href="manifest.json"><title>دستیار فارسی</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;color:#173b39;background:#f3f7f6}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0000000d}h1{margin:0 0 5px}.sub,.hint,.status{color:#667371}.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 16px;font:inherit;cursor:pointer;background:#00A898;color:#fff}.btn.secondary{background:#edf5f3;color:#173b39}.btn.danger{background:#eee;color:#7b2f2f}textarea,input{width:100%;border:1px solid #d2dddb;border-radius:14px;padding:13px;font:inherit}textarea{min-height:110px;resize:vertical}.result{white-space:pre-wrap;line-height:1.9}.settings{display:none}.settings.open{display:block}.task{border-bottom:1px solid #edf0ef;padding:12px 0}.task:last-child{border-bottom:0}.task.done{opacity:.5;text-decoration:line-through}.task button{margin-top:7px}.empty{color:#777}.pill{display:inline-block;background:#e8f6f3;padding:5px 9px;border-radius:999px;font-size:12px}</style></head><body><main class="app"><header><h1>دستیار فارسی</h1><div class="sub">دستیار شخصی Agentic AI</div></header><section class="card"><span class="pill">Voice-first</span><textarea id="command" placeholder="مثلاً: فردا ساعت ۱۳ یادم بنداز با اداره تماس بگیرم"></textarea><div class="row"><button class="btn" id="run">اجرا</button><button class="btn secondary" id="listen">🎙️ صحبت</button><button class="btn secondary" id="speak">🔊 خواندن</button></div><div class="status" id="status">آماده</div></section><section class="card"><h3>کارهای باز</h3><div id="tasks"></div></section><section class="card"><div class="row"><button class="btn secondary" id="pick">📎 انتخاب فایل</button><button class="btn secondary" id="settingsBtn">تنظیمات</button></div><input id="file" type="file" hidden><div class="settings" id="settings"><p class="hint">کلید AI فقط روی همین دستگاه ذخیره می‌شود.</p><input id="apiKey" type="password" autocomplete="off" placeholder="OpenRouter API Key"><div class="row"><button class="btn" id="saveKey">ذخیره</button><button class="btn danger" id="clearKey">پاک کردن</button></div></div></section><section class="card"><div class="result" id="result">آماده دریافت فرمان.</div></section></main><script src="app.js"></script></body></html>
